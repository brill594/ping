[package]
name = "ping-agent-mail"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Low-resource local agent progress notifications through Cloudflare Email Sending"

[[bin]]
name = "ping-agent-mail"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
